<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>句间 · 英语学习播放器</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <header>
      <div class="brand"><span class="logo">句</span><div><h1>句间 <span>英语学习播放器</span></h1><p>听懂一句，再向前一点。</p></div></div>
      <div class="file-actions"><button id="openVideo" class="primary">打开本地视频</button><button id="openSubtitle">加载字幕</button><input id="videoFile" type="file" accept="video/*,.mp4,.m4v,.mov,.webm" hidden><input id="subtitleFile" type="file" accept=".srt,.vtt" hidden></div>
    </header>
    <section id="player" aria-label="视频播放器">
      <div id="stage">
        <video id="video" playsinline preload="metadata" tabindex="0" aria-label="视频画面，空格播放暂停，左右键跳转"></video>
        <div id="empty"><div class="empty-icon">▷</div><h2>把视频放进来，慢慢听懂它</h2><p>拖入一个 MP4，或点击上方「打开本地视频」</p><span>文件只在本机播放 · 无需上传 · 离线可用</span></div>
      </div>
      <div id="subtitleArea" hidden aria-label="外置字幕"><div id="subtitleText"></div></div>
      <div id="controls">
        <div class="timeline"><span id="currentTime">00:00</span><input id="progress" type="range" min="0" max="1000" step="0.1" value="0" aria-label="播放进度" disabled><span id="duration">00:00</span></div>
        <div class="transport">
          <div class="transport-left"><button id="back" title="左方向键" disabled>← <span id="backLabel">10</span>s</button><button id="play" class="play" disabled aria-label="播放">播放</button><button id="forward" title="右方向键" disabled><span id="forwardLabel">10</span>s →</button><span id="status" role="status">等待打开视频</span></div>
          <div class="transport-right"><label>音量 <input id="volume" type="range" min="0" max="1" step="0.01" value="1" aria-label="音量"></label><label>速度 <select id="speed" aria-label="播放速度"><option value="0.5">0.5×</option><option value="0.75">0.75×</option><option value="0.9">0.9×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2×</option></select></label><button id="fullscreen">全屏</button></div>
        </div>
      </div>
    </section>
    <section class="settings" aria-label="跳转和字幕设置">
      <div class="setting-title"><h2>按你的节奏</h2><p>修改立即生效，自动记住设置</p></div>
      <label class="step-setting"><span><kbd>←</kbd> 快退</span><div><input id="backSeconds" type="number" min="0.1" max="3600" step="0.1" value="10" aria-label="快退秒数"><span>秒 / 次</span></div></label>
      <label class="step-setting"><span><kbd>→</kbd> 快进</span><div><input id="forwardSeconds" type="number" min="0.1" max="3600" step="0.1" value="10" aria-label="快进秒数"><span>秒 / 次</span></div></label>
      <div class="subtitle-settings"><label>字幕偏移 <input id="subtitleOffset" type="number" min="-3600" max="3600" step="0.1" value="0" aria-label="字幕偏移秒数"> 秒</label><small>正数让字幕晚出现</small><label>字幕字号 <select id="subtitleSize"><option value="20">小</option><option value="26" selected>中</option><option value="32">大</option></select></label></div>
    </section>
    <footer><span id="filename">尚未选择视频</span><span><kbd>←</kbd> 快退 <kbd>→</kbd> 快进 <kbd>Space</kbd> 播放 / 暂停 <kbd>F</kbd> 全屏</span></footer>
    <p class="note">控制栏始终在画面外，不遮挡视频里的中英文字幕。另载的 SRT / VTT 显示在画面下方；MP4 内封装的可选字幕暂不支持。</p>
  </main>
  <script src="app.js"></script>
</body>
</html>
